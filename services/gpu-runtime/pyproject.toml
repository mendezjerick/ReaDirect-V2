[project]
name = "readirect-gpu-runtime"
version = "0.1.0"
description = "Cross-process GPU coordination for ReaDirect inference services"
requires-python = ">=3.11,<3.12"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
