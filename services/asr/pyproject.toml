[project]
name = "readirect-asr"
version = "0.0.0"
description = "ReaDirect speech recognition and pronunciation service"
requires-python = ">=3.11,<3.12"
dependencies = [
  "cmudict",
  "ctranslate2",
  "fastapi",
  "faster-whisper",
  "huggingface-hub",
  "jiwer",
  "numpy",
  "openai-whisper",
  "python-multipart",
  "soundfile",
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "transformers",
  "uvicorn",
  "websockets",
]

[dependency-groups]
dev = [
  "httpx",
  "pytest",
  "ruff",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
